<style>
:root{
  --bg:#0e1126; --card:#151a36; --edge:#2a3163; --ink:#eef0ff; --rose:#f2c96b; --btn:#f2c96b; --btn-ink:#14213d;
  --eyebrow:#9aa3e6; --sub:#9aa3e6; --orn:#6f79c9; --no-bg:#1b2147; --no-line:#3a4380; --no-ink:#c8cdf5;
  --glow:rgba(242,201,107,.10);
  --sh-card:0 40px 140px rgba(0,0,0,.55),0 12px 44px var(--glow);
  --sh-yes:0 18px 32px -10px rgba(242,201,107,.5),0 6px 12px -4px rgba(242,201,107,.3);
  --sh-no:0 14px 28px -12px rgba(0,0,0,.8),0 4px 10px -4px rgba(0,0,0,.5);
  --bw:clamp(104px,calc((100vw - 100px)/2),285px);
  --bh:min(calc(var(--bw)*.41),13.2vh);
  --gap:clamp(14px,2vw,33px);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  display:grid;place-items:center;padding:clamp(12px,5vh,45px) 12px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
main{
  width:min(1140px,100%);text-align:center;background:var(--card);border:1px solid var(--edge);border-radius:8px;box-shadow:var(--sh-card);
  padding:clamp(36px,14vh,126px) clamp(18px,4vw,56px);
}
.eyebrow{margin:0;font-size:clamp(11px,1.7vh + .2vw,15px);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--eyebrow)}
.orn{display:flex;justify-content:center;align-items:center;gap:clamp(14px,2.9vh,26px);margin:clamp(18px,4.4vh,40px) 0 clamp(8px,2.2vh,18px);color:var(--orn)}
.orn svg{width:clamp(20px,2.9vh,26px);height:auto}
h1{
  margin:0;font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:400;
  font-size:clamp(36px,min(13.2vw,11.7vh),104px);line-height:1.03;letter-spacing:-.025em;
}
h1 em{color:var(--rose);font-style:italic}
.sub{margin:clamp(16px,4.5vh,40px) 0 clamp(26px,9vh,80px);font-size:clamp(14px,2.3vh,20px);color:var(--sub);line-height:1.4}
.row{display:flex;justify-content:center;gap:var(--gap)}
.btn{
  font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:400;font-size:min(calc(var(--bw)*.135),4.4vh);
  width:var(--bw);height:var(--bh);min-height:56px;border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.32em;line-height:1;
}
#yes{background:var(--btn);color:var(--btn-ink);border:0;box-shadow:var(--sh-yes);transition:transform .2s ease,box-shadow .2s ease}
#yes:hover,#yes:focus-visible{transform:translateY(-3px);box-shadow:0 26px 40px -12px rgba(242,201,107,.6),0 8px 14px -4px rgba(242,201,107,.35)}
#yes:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
#yes svg{width:.66em;height:.66em}
#slot{display:inline-block;width:var(--bw);height:var(--bh);min-height:56px}
#no{position:fixed;left:0;top:0;z-index:5;background:var(--no-bg);color:var(--no-ink);border:1px solid var(--no-line);
  box-shadow:var(--sh-no);touch-action:none;will-change:transform;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
#thanks{display:none}
body.done #ask,body.done #no{display:none}
body.done #thanks{display:block}
#thanks h2{margin:0 0 .25em;font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(40px,min(12vw,11vh),96px);line-height:1.04;letter-spacing:-.025em}
#thanks h2 em{color:var(--rose)}
#thanks p{margin:0;font-size:clamp(15px,2.6vh,22px);color:var(--sub)}
#thanks .couple{margin:clamp(6px,1.5vh,14px) 0 0;padding-top:0;position:relative}
#thanks .couple::before{content:"";display:block;width:min(180px,40%);height:1px;margin:0 auto clamp(10px,2vh,16px);background:linear-gradient(to right,transparent,var(--orn),transparent)}
#thanks .couple .eyebrow{margin-bottom:clamp(10px,2.4vh,22px);letter-spacing:.14em;line-height:1.5;font-size:clamp(11px,1.7vh + .2vw,15px);color:var(--eyebrow)}
#thanks .names{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:clamp(10px,2.4vw,28px);
  font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(34px,min(10vw,9vh),84px);line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
#thanks .names em{color:var(--rose)}
#thanks .names svg{width:.5em;height:.5em;color:var(--btn);flex:none;animation:beat2 1.8s ease-in-out infinite}
@keyframes beat2{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}}
#thanks .tag{margin-top:clamp(10px,2.4vh,20px);font-family:"Newsreader",Georgia,serif;font-style:italic;color:var(--rose);font-size:clamp(16px,2.6vh,24px)}
body.done #thanks .couple{animation:rise .8s ease-out .5s both}
@media (prefers-reduced-motion:reduce){#thanks .names svg{animation:none}body.done #thanks .couple{animation-duration:.01s!important;animation-delay:0s!important}}
.confetti{position:fixed;top:-30px;z-index:9;pointer-events:none;will-change:transform;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(0,112vh,0) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{animation-duration:2s!important}}

main{position:relative;overflow:hidden;transform-origin:50% 0;will-change:transform,opacity}
body.covered{overflow:hidden;height:100svh}
body.covered main{opacity:.01;animation:none}
body.covered #no,body.unfold #no{visibility:hidden}
#cover{position:fixed;inset:0;z-index:50;background:#0e1126;color:#eef0ff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + clamp(48px,11vh,90px)) 24px calc(env(safe-area-inset-bottom,0px) + clamp(40px,8vh,70px));
  cursor:pointer;outline:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
#cover.leaving{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .8s ease,visibility 0s linear .8s}
#cover .top{margin:0;font-size:clamp(11px,1.6vh + .2vw,14px);font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:#9aa3e6;text-align:center}
#cover .sky{display:block;height:auto;overflow:visible}
#cover .sky-m{width:min(300px,78vw,36vh)}
#cover .sky-d{display:none;width:min(1000px,86vw)}
#cover .bottom{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,22px)}
#cover .line{margin:0;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(26px,min(8.6vw,4.2vh),40px);line-height:1.1;text-align:center;letter-spacing:-.01em}
#cover .hint{margin:0;font-size:clamp(12px,1.8vh,14px);letter-spacing:.14em;color:#9aa3e6;animation:pulse 2.2s ease-in-out infinite}
#cover .c{display:none}
@media (min-width:760px){
  #cover .sky-m{display:none}#cover .sky-d{display:block}
  #cover .line{font-size:clamp(40px,min(4.4vw,7.6vh),64px);line-height:1.08}
}
@media (hover:hover) and (pointer:fine){#cover .t{display:none}#cover .c{display:inline}}
#cover.opening .hint{animation:none;opacity:0;transition:opacity .25s}
@keyframes pulse{50%{opacity:.35}}
#cover .tw{animation:tw 3s ease-in-out infinite}
#cover .tw:nth-of-type(2n){animation-delay:-1s}#cover .tw:nth-of-type(3n){animation-delay:-2s}
@keyframes tw{50%{opacity:.3}}
#cover .halo,#cover .gold{transform-box:fill-box;transform-origin:center}
#cover .halo{animation:halo 2.6s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.4);opacity:.1}}
#cover .path{transition:stroke .6s,stroke-width .6s}
#cover.opening .path{stroke:#f2c96b;stroke-width:2}
#cover.opening .gold{animation:flash 1.2s ease-out both}
@keyframes flash{40%{transform:scale(1.7)}100%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){#cover .tw,#cover .halo,#cover .hint{animation:none!important}#cover.opening .gold{animation-duration:.01s!important}}
main::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:
   linear-gradient(to bottom,transparent calc(33.333% - 46px),rgba(0,0,0,.3) calc(33.333% - 1px),rgba(255,255,255,.07) 33.333%,transparent calc(33.333% + 46px)),
   linear-gradient(to bottom,transparent calc(66.666% - 46px),rgba(0,0,0,.3) calc(66.666% - 1px),rgba(255,255,255,.07) 66.666%,transparent calc(66.666% + 46px))}
body.unfold main{animation:unfold 1.6s cubic-bezier(.35,.05,.15,1) both,unfold-fade .5s ease-out both}
body.unfold main::after{animation:crease 1.4s ease-in-out forwards}
body.unfold #ask{animation:rise .7s ease-out .85s both}
@keyframes unfold{
  from{transform:perspective(1500px) translateY(7vh) rotateX(-84deg) scale(.5)}
  to{transform:perspective(1500px) translateY(0) rotateX(0) scale(1)}}
@keyframes unfold-fade{from{opacity:0}to{opacity:1}}
@keyframes crease{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){body.unfold main,body.unfold main::after,body.unfold #ask{animation-duration:.01s!important;animation-delay:0s!important}}

body::before,body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;animation:twk 5s ease-in-out infinite}
body::before{background-image:
  radial-gradient(1.6px 1.6px at 8% 14%,#eef0ff,transparent),radial-gradient(1.2px 1.2px at 22% 62%,#eef0ff,transparent),
  radial-gradient(2px 2px at 36% 9%,#f2c96b,transparent),radial-gradient(1.2px 1.2px at 51% 88%,#eef0ff,transparent),
  radial-gradient(1.6px 1.6px at 67% 21%,#eef0ff,transparent),radial-gradient(1.2px 1.2px at 79% 74%,#eef0ff,transparent),
  radial-gradient(2px 2px at 91% 40%,#f2c96b,transparent),radial-gradient(1.2px 1.2px at 14% 91%,#eef0ff,transparent)}
body::after{animation-delay:-2.5s;background-image:
  radial-gradient(1.2px 1.2px at 4% 46%,#eef0ff,transparent),radial-gradient(1.6px 1.6px at 29% 33%,#eef0ff,transparent),
  radial-gradient(1.2px 1.2px at 44% 52%,#eef0ff,transparent),radial-gradient(1.6px 1.6px at 58% 6%,#eef0ff,transparent),
  radial-gradient(2px 2px at 73% 93%,#f2c96b,transparent),radial-gradient(1.2px 1.2px at 86% 12%,#eef0ff,transparent),
  radial-gradient(1.6px 1.6px at 96% 66%,#eef0ff,transparent),radial-gradient(1.2px 1.2px at 17% 27%,#eef0ff,transparent)}
@keyframes twk{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
main{z-index:1}
</style>
</head>
<body class="covered">

<main>
  <section id="ask">
    <p class="eyebrow">A little note from us</p>
    <div class="orn" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20.5S3.5 15 3.5 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.5 2.3C20.5 15 12 20.5 12 20.5z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>

<button id="no" class="btn" type="button">No</button>

<script>
(function(){
  var no=document.getElementById('no'), yes=document.getElementById('yes'), slot=document.getElementById('slot');
  var mx=-999,my=-999,fled=false;
  var ready=false;
  var answered=false;

  /* sound separated from the dodging logic */
  var SILENT_WAV='data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
  var snd=null,lastPlay=0,primed=false;
  try{snd=new Audio('fah.mp3');snd.preload='auto';snd.loop=false}catch(err){}

  function canSound(e){
    if(!ready||answered)return false;
    if(!e||unlocked)return true;
    var t=e.type;
    if(t==='touchstart'||t==='touchmove'||t==='focus'||t==='contextmenu')return false;
    if(e.pointerType==='touch'&&t!=='pointerup')return false;
    return true;
  }
  var AC=window.AudioContext||window.webkitAudioContext,ctx=null,buf=null,cur=null;
  try{ctx=new AC({latencyHint:'interactive'})}catch(err){try{ctx=new AC()}catch(e2){ctx=null}}
  var loading=false;
  function loadBuf(){
    if(!ctx||buf||loading)return;
    loading=true;
    try{
      fetch('fah.mp3').then(function(r){return r.arrayBuffer()}).then(function(ab){
        ctx.decodeAudioData(ab,function(b){buf=b;loading=false},function(){loading=false});
      }).catch(function(){loading=false});
    }catch(err){loading=false}
  }
  loadBuf();

  function wake(){
    if(ctx&&ctx.state!=='running'){try{var r=ctx.resume();if(r&&r.catch)r.catch(function(){})}catch(err){}}
  }
  ['touchstart','touchend','pointerdown','click'].forEach(function(t){document.addEventListener(t,wake,{capture:true,passive:true})});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});

  function playNo(){
    if(!ready||answered)return;
    var n=Date.now();
    if(n-lastPlay<220)return;
    lastPlay=n;
    if(ctx&&buf){
      try{
        wake();
        var src=ctx.createBufferSource();
        src.buffer=buf;src.connect(ctx.destination);src.start(0);
        return;
      }catch(err){}
    }
    loadBuf();
    if(!snd)return;
    try{
      if(!snd.paused){var c=snd.cloneNode();c.play();return}
      snd.currentTime=0;
      var p=snd.play();
      if(p&&p.catch)p.catch(function(){lastPlay=0});
    }catch(err){lastPlay=0}
  }

  /* the cover tap is the first user gesture: it unlocks audio for the whole session */
  var unlocked=false;
  function unlock(){
    if(unlocked)return;
    unlocked=true;
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(err){}
    if(ctx){
      try{
        wake();
        var b=ctx.createBuffer(1,1,22050),sb=ctx.createBufferSource();
        sb.buffer=b;sb.connect(ctx.destination);sb.start(0);
        loadBuf();
      }catch(err){}
    }
    if(snd&&!(ctx&&buf)){
      try{
        snd.src=SILENT_WAV;
        var p=snd.play();
        var restore=function(){try{snd.pause()}catch(e){}try{snd.src='fah.mp3';snd.load()}catch(e){}};
        if(p&&p.then)p.then(restore,restore);else restore();
      }catch(err){try{snd.src='fah.mp3'}catch(e){}}
    }
  }
  var cover=document.getElementById('cover'),main=document.querySelector('main'),opened=false;
  function startUnfold(){
    var b=document.body;
    b.classList.add('unfold');
    b.classList.remove('covered');
    cover.classList.add('leaving');
    var finished=false;
    function end(){
      if(finished)return;finished=true;
      b.classList.remove('unfold');

  function openCover(){

  cover.addEventListener('click',openCover);
  cover.addEventListener('touchend',function(e){e.preventDefault();openCover()},{passive:false});

  function place(x,y){no.style.transform='translate3d('+x+'px,'+y+'px,0)'}

      if(!bad&&d>bestD){best=[x,y];bestD=d}
    }
    if(!best)best=[Math.random()<.5?m:maxX,Math.random()<.5?m:maxY];
    place(best[0],best[1]);
  }
  function dodge(e){
    if(!ready||answered)return;
    if(e){if(e.cancelable)e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
    flee();
    if(canSound(e))playNo();
    if(document.activeElement===no)no.blur();
  }
  ['pointerenter','pointerover','mouseenter','mouseover','pointerdown','mousedown','touchstart','touchmove','touchend','click','focus','dblclick','contextmenu'].forEach(function(t){
    no.addEventListener(t,dodge,{passive:false});
  });
  function track(x,y,e){
    mx=x;my=y;
    if(!ready||answered)return;
    var r=no.getBoundingClientRect(),pad=70;
    if(!r.width||!r.height)return;
    if(x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad){flee();if(canSound(e))playNo();}
  }
  var tpend=null,traf=0,tx=0,ty=0;

  document.addEventListener('pointermove',function(e){trackSoon(e.clientX,e.clientY,e)},{passive:true});

  document.addEventListener('keydown',function(e){if(document.activeElement===no)dodge(e)});

  function sync(){
    if(!fled){home();return}
    var r=no.getBoundingClientRect();
    if(r.right>window.innerWidth||r.bottom>window.innerHeight)flee();

  window.addEventListener('resize',sync);
  window.addEventListener('scroll',function(){if(!fled)home()},{passive:true});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sync);
  home();

  yes.addEventListener('click',function(){
    answered=true;
    document.body.classList.add('done');
    var H='M12 20.5S3.5 15 3.5 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.5 2.3C20.5 15 12 20.5 12 20.5z',S='<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"',bits=[S+' fill="currentColor"><path d="'+H+'"/></svg>',S+' fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="'+H+'"/></svg>',S+' fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'],cols=['#f2c96b','#e2b857','#9aa3e6','#eef0ff'];
    var frag=document.createDocumentFragment(),pieces=[];
    for(var i=0;i<50;i++){
      var c=document.createElement('span');c.className='confetti';
      c.innerHTML=bits[i%bits.length];c.style.color=cols[i%cols.length];
      c.style.left=(Math.random()*100)+'vw';c.style.fontSize=(18+Math.random()*26)+'px';
      c.style.animationDuration=(2.5+Math.random()*3)+'s';c.style.animationDelay=(Math.random()*1.2)+'s';

  });
})();
