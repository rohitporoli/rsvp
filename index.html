<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">

<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f4; --card:#fefcf9; --edge:#ece5df; --ink:#463a36; --rose:#a85c68; --btn:#bf757b; --btn-ink:#fff;
  --eyebrow:#c0707c; --sub:#8c7b72; --orn:#c58f95; --no-bg:#fffefd; --no-line:#d9d2cc; --no-ink:#6f625c;
  --glow:rgba(196,128,128,.22);
  --env:#ecd6d2; --env-back:#dfc3bf; --env-flap:#f3e1de;
  --sh-card:0 40px 140px var(--glow),0 12px 44px rgba(196,128,128,.12);
  --sh-yes:0 18px 32px -10px rgba(191,117,123,.65),0 6px 12px -4px rgba(191,117,123,.35);
  --sh-no:0 14px 28px -12px rgba(70,58,54,.3),0 4px 10px -4px rgba(70,58,54,.14);
  --bw:clamp(104px,calc((100vw - 100px)/2),285px);
  --bh:min(calc(var(--bw)*.41),13.2vh);
  --gap:clamp(14px,2vw,33px);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181112; --card:#221819; --edge:#3a2c2e; --ink:#f4e9e4; --rose:#e19aa4; --eyebrow:#e0929c; --sub:#bda99f; --orn:#b98c8c;
    --no-bg:#2b2023; --no-line:#4c3d40; --no-ink:#d9c8c0; --glow:rgba(0,0,0,.6); --env:#4b3538; --env-back:#3b2a2d; --env-flap:#5a4144;
    --sh-no:0 14px 28px -12px rgba(0,0,0,.8),0 4px 10px -4px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181112; --card:#221819; --edge:#3a2c2e; --ink:#f4e9e4; --rose:#e19aa4; --eyebrow:#e0929c; --sub:#bda99f; --orn:#b98c8c;
  --no-bg:#2b2023; --no-line:#4c3d40; --no-ink:#d9c8c0; --glow:rgba(0,0,0,.6); --env:#4b3538; --env-back:#3b2a2d; --env-flap:#5a4144;
  --sh-no:0 14px 28px -12px rgba(0,0,0,.8),0 4px 10px -4px rgba(0,0,0,.5); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  display:grid;place-items:center;padding:clamp(12px,5vh,45px) 12px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
main{
  width:min(1140px,100%);text-align:center;background:var(--card);border:1px solid var(--edge);border-radius:8px;box-shadow:var(--sh-card);
  padding:clamp(36px,14vh,126px) clamp(18px,4vw,56px);
}
.eyebrow{margin:0;font-size:clamp(11px,1.7vh + .2vw,15px);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--eyebrow)}
.orn{display:flex;justify-content:center;align-items:center;gap:clamp(14px,2.9vh,26px);margin:clamp(18px,4.4vh,40px) 0 clamp(8px,2.2vh,18px);color:var(--orn)}
.orn svg{width:clamp(20px,2.9vh,26px);height:auto}
h1{
  margin:0;font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:400;
  font-size:clamp(36px,min(13.2vw,11.7vh),104px);line-height:1.03;letter-spacing:-.025em;
}
h1 em{color:var(--rose);font-style:italic}
.sub{margin:clamp(16px,4.5vh,40px) 0 clamp(26px,9vh,80px);font-size:clamp(14px,2.3vh,20px);color:var(--sub);line-height:1.4}
.row{display:flex;justify-content:center;gap:var(--gap)}
.btn{
  font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:400;font-size:min(calc(var(--bw)*.135),4.4vh);
  width:var(--bw);height:var(--bh);min-height:56px;border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.32em;line-height:1;
}
#yes{background:var(--btn);color:var(--btn-ink);border:0;box-shadow:var(--sh-yes);transition:transform .2s ease,box-shadow .2s ease}
#yes:hover,#yes:focus-visible{transform:translateY(-3px);box-shadow:0 26px 40px -12px rgba(191,117,123,.75),0 8px 14px -4px rgba(191,117,123,.4)}
#yes:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
#yes svg{width:.66em;height:.66em}
#slot{display:inline-block;width:var(--bw);height:var(--bh);min-height:56px}
#no{position:fixed;left:0;top:0;z-index:5;background:var(--no-bg);color:var(--no-ink);border:1px solid var(--no-line);
  box-shadow:var(--sh-no);touch-action:none;transition:left .22s cubic-bezier(.3,1.4,.5,1),top .22s cubic-bezier(.3,1.4,.5,1)}
#thanks{display:none}
body.done #ask,body.done #no{display:none}
body.done #thanks{display:block}
#thanks h2{margin:0 0 .25em;font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(40px,min(12vw,11vh),96px);line-height:1.04;letter-spacing:-.025em}
#thanks h2 em{color:var(--rose)}
#thanks p{margin:0;font-size:clamp(15px,2.6vh,22px);color:var(--sub)}
.confetti{position:fixed;top:-30px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{animation-duration:2s!important}}

main{position:relative;overflow:hidden;transform-origin:50% 0}
body.covered{overflow:hidden;height:100svh}
body.covered main{opacity:0;animation:none}
body.covered #no,body.unfold #no{visibility:hidden}
#cover{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;align-content:center;gap:clamp(22px,5vh,44px);
  cursor:pointer;outline:0;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
#cover.leaving{opacity:0;pointer-events:none;transition:opacity .8s ease}
#cover .line{margin:0;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(20px,3.4vh + 1vw,30px);color:var(--rose);letter-spacing:-.01em;text-align:center}
#cover .hint{margin:0;font-size:clamp(13px,2vh,16px);color:var(--sub);letter-spacing:.04em;animation:pulse 2.2s ease-in-out infinite}
#cover.opening .hint{animation:none;opacity:0;transition:opacity .25s}
@keyframes pulse{50%{opacity:.35}}
.env{position:relative;width:min(380px,78vw,56vh);aspect-ratio:10/7;perspective:900px;animation:bob 4.5s ease-in-out infinite;filter:drop-shadow(0 28px 36px var(--glow))}
#cover.opening .env{animation:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(-.6deg)}}
.env .back{position:absolute;inset:0;background:var(--env-back);border-radius:6px}
.env .letter{position:absolute;left:7%;right:7%;top:7%;height:82%;background:var(--card);border:1px solid var(--edge);border-radius:4px;z-index:2;
  display:grid;place-items:center;align-content:center;gap:.5em;text-align:center;color:var(--rose);
  font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(15px,2.4vh + .6vw,22px);
  transition:transform 1s cubic-bezier(.25,.9,.3,1) .45s}
.env .letter svg{width:1.4em;height:1.4em}
.env .front{position:absolute;inset:0;background:var(--env);border-radius:6px;z-index:3;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:var(--env-flap);z-index:4;transform-origin:50% 0;
  clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s ease,z-index 0s .3s}
.env .seal{position:absolute;left:50%;top:58%;width:17%;aspect-ratio:1;z-index:5;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(191,117,123,.7),inset 0 -3px 6px rgba(0,0,0,.12);
  animation:beat 2.2s ease-in-out infinite;transition:opacity .25s}
.env .seal svg{width:52%;height:52%}
@keyframes beat{0%,60%,100%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}}
#cover.opening .seal{animation:none;opacity:0}
#cover.opening .flap{transform:rotateX(180deg);z-index:1}
#cover.opening .letter{transform:translateY(-52%)}
@media (prefers-reduced-motion:reduce){.env,.seal,#cover .hint{animation:none!important}.env .letter,.env .flap{transition-duration:.01s!important;transition-delay:0s!important}}

.env .seal::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--btn);animation:ring 2.2s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
main::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:
   linear-gradient(to bottom,transparent calc(33.333% - 46px),rgba(70,58,54,.12) calc(33.333% - 1px),rgba(255,255,255,.14) 33.333%,transparent calc(33.333% + 46px)),
   linear-gradient(to bottom,transparent calc(66.666% - 46px),rgba(70,58,54,.12) calc(66.666% - 1px),rgba(255,255,255,.14) 66.666%,transparent calc(66.666% + 46px))}
body.unfold main{animation:unfold 1.6s cubic-bezier(.22,.8,.24,1) both}
body.unfold main::after{animation:crease 1.8s ease-out forwards}
body.unfold #ask>*{animation:rise .7s ease-out .85s both}
@keyframes unfold{
  0%{opacity:0;transform:perspective(1500px) translateY(7vh) rotateX(-84deg) scale(.5)}
  30%{opacity:1;transform:perspective(1500px) translateY(3vh) rotateX(-52deg) scale(.7)}
  65%{transform:perspective(1500px) translateY(0) rotateX(-14deg) scale(.93)}
  85%{transform:perspective(1500px) rotateX(3deg) scale(1.005)}
  100%{opacity:1;transform:perspective(1500px) rotateX(0) scale(1)}}
@keyframes crease{0%,55%{opacity:1}100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){body.unfold main,body.unfold main::after,body.unfold #ask>*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body class="covered">
<div id="cover" role="button" tabindex="0" aria-label="Tap to open your invitation">
  <p class="line">We have a little question for you</p>
  <div class="env" aria-hidden="true">
    <div class="back"></div>
    <div class="letter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20.5S3.5 15 3.5 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.5 2.3C20.5 15 12 20.5 12 20.5z"/></svg>
      <span>You&rsquo;re invited</span>
    </div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M7.5 4.5L17 12.5l-4.2.9 2.4 5.2-2.2 1.1-2.4-5.1-3.1 3z"/><path d="M4 8.5H2.2M5 5L3.7 3.7M8.5 3.4V1.7" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  </div>
  <p class="hint">Tap to open</p>
</div>
<main>
  <section id="ask">
    <p class="eyebrow">A little note from us</p>
    <div class="orn" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20.5S3.5 15 3.5 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.5 2.3C20.5 15 12 20.5 12 20.5z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>
    </div>
    <h1>Will you attend<br>our <em>marriage?</em></h1>
    <p class="sub">It wouldn’t be the same without you there.</p>
    <div class="row">
      <button id="yes" class="btn" type="button">Yes
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5S3.5 15 3.5 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.5 2.3C20.5 15 12 20.5 12 20.5z"/></svg>
      </button>
      <span id="slot" aria-hidden="true"></span>
    </div>
  </section>
  <section id="thanks" aria-live="polite">
    <h2>Yay, see you <em>there!</em></h2>
    <p>You just made our day.</p>
  </section>
</main>
<button id="no" class="btn" type="button">No</button>

<script>
(function(){
  var no=document.getElementById('no'), yes=document.getElementById('yes'), slot=document.getElementById('slot');
  var mx=-999,my=-999,fled=false;

  /* sound separated from the dodging logic */
  var snd=null,lastPlay=0,primed=false;
  try{snd=new Audio('fah.mp3');snd.preload='auto';snd.loop=false}catch(err){}

  function canSound(e){
    if(!e||unlocked)return true;
    var t=e.type;
    if(t==='touchstart'||t==='touchmove'||t==='focus'||t==='contextmenu')return false;
    if(e.pointerType==='touch'&&t!=='pointerup')return false;
    return true;
  }
  var AC=window.AudioContext||window.webkitAudioContext,ctx=null,buf=null,cur=null;
  try{ctx=new AC({latencyHint:'interactive'})}catch(err){try{ctx=new AC()}catch(e2){ctx=null}}
  var loading=false;
  function loadBuf(){
    if(!ctx||buf||loading)return;
    loading=true;
    try{
      fetch('fah.mp3').then(function(r){return r.arrayBuffer()}).then(function(ab){
        ctx.decodeAudioData(ab,function(b){buf=b;loading=false},function(){loading=false});
      }).catch(function(){loading=false});
    }catch(err){loading=false}
  }
  loadBuf();

  function wake(){
    if(ctx&&ctx.state!=='running'){try{var r=ctx.resume();if(r&&r.catch)r.catch(function(){})}catch(err){}}
  }
  ['touchstart','touchend','pointerdown','click'].forEach(function(t){document.addEventListener(t,wake,{capture:true,passive:true})});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});

  function playNo(){
    var n=Date.now();
    if(n-lastPlay<220)return;
    lastPlay=n;
    if(ctx&&buf){
      try{
        wake();
        var src=ctx.createBufferSource();
        src.buffer=buf;src.connect(ctx.destination);src.start(0);
        return;
      }catch(err){}
    }
    loadBuf();
    if(!snd)return;
    try{
      if(!snd.paused){var c=snd.cloneNode();c.play();return}
      snd.currentTime=0;
      var p=snd.play();
      if(p&&p.catch)p.catch(function(){lastPlay=0});
    }catch(err){lastPlay=0}
  }

  /* the cover tap is the first user gesture: it unlocks audio for the whole session */
  var unlocked=false;
  function unlock(){
    if(unlocked)return;
    unlocked=true;
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(err){}
    if(ctx){
      try{
        wake();
        var b=ctx.createBuffer(1,1,22050),sb=ctx.createBufferSource();
        sb.buffer=b;sb.connect(ctx.destination);sb.start(0);
        loadBuf();
      }catch(err){}
    }
    if(snd){
      try{
        snd.muted=true;
        var p=snd.play();
        var done=function(){try{snd.pause();snd.currentTime=0}catch(e){}snd.muted=false};
        if(p&&p.then)p.then(done,done);else done();
      }catch(err){snd.muted=false}
    }
  }
  var cover=document.getElementById('cover'),main=document.querySelector('main'),opened=false;
  function openCover(){
    if(opened)return;opened=true;
    unlock();
    cover.classList.add('opening');
    setTimeout(function(){
      var b=document.body;
      b.classList.add('unfold');
      b.classList.remove('covered');
      cover.classList.add('leaving');
      var finished=false;
      function end(){
        if(finished)return;finished=true;
        b.classList.remove('unfold');
        cover.remove();
        home();
      }
      main.addEventListener('animationend',function(e){if(e.target===main&&e.animationName==='unfold')end()});
      setTimeout(end,2200);
    },1500);
  }
  cover.addEventListener('click',openCover);
  cover.addEventListener('touchend',function(e){e.preventDefault();openCover()},{passive:false});
  cover.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openCover()}});
  cover.focus({preventScroll:true});

  function place(x,y){no.style.left=x+'px';no.style.top=y+'px'}
  function home(){var r=slot.getBoundingClientRect();no.style.width=r.width+'px';no.style.height=r.height+'px';place(r.left,r.top)}
  function overlaps(x,y,w,h,r,pad){return x<r.right+pad&&x+w>r.left-pad&&y<r.bottom+pad&&y+h>r.top-pad}

  var lastFlee=0;
  function flee(){
    var t=Date.now();if(t-lastFlee<40)return;lastFlee=t;
    fled=true;
    var w=no.offsetWidth,h=no.offsetHeight,m=12,W=window.innerWidth,H=window.innerHeight;
    var maxX=Math.max(m,W-w-m),maxY=Math.max(m,H-h-m),yr=yes.getBoundingClientRect(),best=null,bestD=-1;
    for(var i=0;i<40;i++){
      var x=m+Math.random()*(maxX-m),y=m+Math.random()*(maxY-m),d=Math.hypot(x+w/2-mx,y+h/2-my);
      var bad=overlaps(x,y,w,h,yr,20);
      if(!bad&&d>Math.min(260,Math.min(W,H)*.45)){best=[x,y];break}
      if(!bad&&d>bestD){best=[x,y];bestD=d}
    }
    if(!best)best=[Math.random()<.5?m:maxX,Math.random()<.5?m:maxY];
    place(best[0],best[1]);
  }
  function dodge(e){
    if(e){if(e.cancelable)e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
    flee();
    if(canSound(e))playNo();
    if(document.activeElement===no)no.blur();
  }
  ['pointerenter','pointerover','mouseenter','mouseover','pointerdown','mousedown','touchstart','touchmove','touchend','click','focus','dblclick','contextmenu'].forEach(function(t){
    no.addEventListener(t,dodge,{passive:false});
  });
  function track(x,y,e){
    mx=x;my=y;
    var r=no.getBoundingClientRect(),pad=70;
    if(x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad){flee();if(canSound(e))playNo();}
  }
  document.addEventListener('pointermove',function(e){track(e.clientX,e.clientY,e)},{passive:true});
  document.addEventListener('touchstart',function(e){var t=e.touches[0];if(t)track(t.clientX,t.clientY,e)},{passive:true});
  document.addEventListener('touchmove',function(e){var t=e.touches[0];if(t)track(t.clientX,t.clientY,e)},{passive:true});
  document.addEventListener('keydown',function(e){if(document.activeElement===no)dodge(e)});

  function sync(){
    if(!fled){home();return}
    var r=no.getBoundingClientRect();
    if(r.right>window.innerWidth||r.bottom>window.innerHeight)flee();
  }
  window.addEventListener('resize',sync);
  window.addEventListener('scroll',function(){if(!fled)home()},{passive:true});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sync);
  home();
